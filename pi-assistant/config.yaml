# ─────────────────────────────────────────────────────────────────────────────
# Pi Assistant — Main Configuration
#
# Values here are the defaults. Sensitive values (API keys, passwords) MUST
# be placed in .env instead of this file. config.py merges both sources.
# ─────────────────────────────────────────────────────────────────────────────

assistant:
  name: "Pi Assistant"
  version: "0.1.0"
  # Log level: DEBUG | INFO | WARNING | ERROR | CRITICAL
  log_level: "INFO"
  # Directory where the assistant data (memory DB, logs) is stored.
  data_dir: "data"

# ── Web Dashboard ──────────────────────────────────────────────────────────────
dashboard:
  enabled: true
  host: "0.0.0.0"   # Bind to all interfaces so you can reach it from Android
  port: 8000
  # Secret key for Flask session signing — OVERRIDE this in .env via DASHBOARD_SECRET_KEY
  secret_key: "change-me-in-env"
  # Session lifetime in minutes
  session_lifetime_minutes: 60
  # Set to true in production (requires HTTPS) — keep false for local Pi HTTP
  session_cookie_secure: false

# ── Authentication ─────────────────────────────────────────────────────────────
auth:
  # Dashboard login credentials.
  # NEVER commit real passwords. Set DASHBOARD_USERNAME / DASHBOARD_PASSWORD in .env.
  username: "admin"
  # bcrypt hash of "changeme" — replace with your own hash (see README)
  password_hash: "$2b$12$placeholder_replace_this_in_env"

# ── AI / LLM Client ───────────────────────────────────────────────────────────
ai:
  # Provider: "openai" | "local" | "custom"
  provider: "openai"
  # Base URL — change to http://localhost:11434/v1 for Ollama on the Pi
  base_url: "https://api.openai.com/v1"
  # API key comes from .env: OPENAI_API_KEY
  default_model: "gpt-4o"
  # Request timeout in seconds
  timeout: 30
  # Max retries on transient failures
  max_retries: 3

# ── Memory (Long-Term Storage) ────────────────────────────────────────────────
memory:
  # Backend: "sqlite" (default, Raspberry Pi-friendly) | future: "postgres", "redis"
  backend: "sqlite"
  # Path relative to data_dir
  db_file: "memory/assistant.db"
  # Maximum number of memory entries returned in a single query
  max_results: 50

# ── Task Scheduler ────────────────────────────────────────────────────────────
scheduler:
  enabled: true
  # Timezone for scheduled tasks (use your local timezone)
  timezone: "UTC"
  # How often the scheduler checks for due jobs (seconds)
  misfire_grace_time: 60

# ── Plugin System ─────────────────────────────────────────────────────────────
plugins:
  # Directory (relative to project root) where plugins are discovered
  directory: "plugins"
  # Explicitly disable specific plugins by folder name
  disabled: []
  # Plugin-specific configuration (keyed by plugin name)
  settings:
    betting_assistant:
      history_limit: 20
    agents:
      # History limit per agent conversation
      history_limit: 20
    example_skill:
      enabled: true

# ── Conversation ───────────────────────────────────────────────────────────────
conversation:
  # Maximum history turns sent to the AI on each request
  history_limit: 20
  # Default sport focus shown in context (blank = no default)
  default_sport: ""

# ── Sports Betting ─────────────────────────────────────────────────────────────
betting:
  # Starting bankroll shown in the dashboard (set via /api/bankroll or the UI)
  starting_bankroll: 0.0
  # Default stake unit as a % of bankroll (for bet-sizing suggestions)
  unit_pct: 2.0
  # Sports you follow most — shown in the system prompt as context
  # e.g. ["NFL", "NBA", "Soccer - EPL", "UFC"]
  tracked_sports: []

# ── Web Scout ──────────────────────────────────────────────────────────────────
# Sources: Reddit, ESPN, Action Network, RotoWire, Covers.com
# Twitter/X requires a paid API ($100/month) — not supported
# Discord requires a bot token — not supported
web_scout:
  # How often to auto-run the scout (hours). Default: 6
  scout_interval_hours: 6
  # Minimum Reddit post score to include (filters noise)
  reddit_min_score: 20
  # Maximum findings sent to AI (controls token cost)
  max_findings: 40

# ── Email Reports ──────────────────────────────────────────────────────────────
# Credentials are set via environment variables (NEVER put them in this file):
#   EMAIL_USER       — Your Gmail address
#   EMAIL_PASSWORD   — Gmail App Password (myaccount.google.com/apppasswords)
#   EMAIL_RECIPIENT  — Where to send reports (can be same as EMAIL_USER)
email:
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
